<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaya Calculator — LIRIN</title>
<meta name="description" content="Enter the price of a Glimmerstone and of Glimmer Dust and see exactly what one Gaya costs to make.">
<meta name="theme-color" content="#0f1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1013'/%3E%3Cpath d='M20 14v36h26' fill='none' stroke='%23c7a76b' stroke-width='5' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
.note{margin:0 auto 22px;max-width:620px;padding:10px 16px;border:1px solid rgba(199,167,107,.22);border-radius:9px;background:rgba(199,167,107,.06);color:#d9c59b;font-size:.84rem;text-align:center}
.panel{margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#16171c}
.panel h2{margin:0;padding:14px 18px;background:#22242b;font-size:1rem;font-weight:600}
.pbody{padding:6px 18px 18px}

/* pictures: shared with Upgrade Cost, initials show only when a picture is missing */
.slot{position:relative;display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:linear-gradient(180deg,#2b2d35,#202228);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#d6bd8c;font-size:.74rem;font-weight:600}
.slot img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;transition:opacity .15s}
.slot>i{display:none;font-style:normal}.slot.no>i{display:block}
img:not(.ok){opacity:0}

/* prices */
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:9px;background:rgba(255,255,255,.035)}
.pin{width:min(100%,310px);overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#22242b}
.pin.bad{border-color:#e0875a}
.pin label{display:flex;align-items:center;gap:8px;padding-right:14px}
.pin input{flex:1;min-width:0;padding:12px 14px;border:0;background:none;font-size:.95rem}.pin em{color:var(--dim);font-size:.85rem;font-style:normal}
.pn{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#1b1c22;color:var(--muted);font-size:.8rem}.qn{color:var(--text);font-weight:600}
.pv{font-size:.9rem;line-height:1.7}.u{color:#e0875a}.t{color:var(--green)}

/* amount */
.qe{display:flex;align-items:center;width:min(100%,220px);margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#1b1c22}
.qe button{width:46px;height:40px;border:0;background:none;font-size:1.2rem;cursor:pointer}.qe button:hover{color:var(--gold)}
.qe input{flex:1;min-width:0;padding:6px;border:0;background:none;text-align:center;font-weight:600}

/* breakdown */
.tr{display:grid;grid-template-columns:minmax(170px,1.4fr) 1fr 1fr;gap:14px;align-items:center;padding:14px 18px}
#rows .tr:nth-child(odd){background:rgba(255,255,255,.03)}
#rows .tr.sum{background:rgba(70,208,129,.07);font-weight:600}
.nm{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500}
.fl{justify-self:end;text-align:right}
.tr.sum .fl{color:var(--green);font-size:1.05rem}

@media(max-width:700px){
  .tr{grid-template-columns:1fr;gap:6px}.fl{justify-self:start;text-align:left}
}
</style>
</head>
<body>
<div class="app-root">
  <nav id="sidebar"></nav>
  <script src="/nav.js"></script>
  <main class="main">
    <div class="inner">
      <h1>GAYA CALCULATOR</h1><div class="line"></div>
      <p class="note" id="note"></p>
      <section class="panel"><h2>Material Prices</h2><div class="pbody" id="prices"></div></section>
      <section class="panel"><h2>How many Gaya?</h2><div class="pbody">
        <div class="qe"><button data-a="qm" aria-label="Less">−</button><input id="qty" inputmode="numeric" maxlength="4" aria-label="Number of Gaya"><button data-a="qp" aria-label="More">+</button></div>
      </div></section>
      <section class="panel"><h2>Cost per Gaya</h2><div id="rows"></div></section>
    </div>
    <div class="summary" aria-live="polite">
      <div><span>Materials :</span><b id="s-m">0 (0)</b></div>
      <div><span>NPC Fee :</span><b id="s-f">0 (0)</b></div>
      <div class="tot"><span>Cost per Gaya :</span><b id="s-t">0 (0)</b></div>
      <div><span id="s-ql">Total ×1 :</span><b id="s-n">0 (0)</b></div>
    </div>
  </main>
</div>
<script>
/* ===== recipe: change the numbers here ===== */
/* n = how many per 1 Gaya; img = picture file name (without .webp) when it differs from the name with underscores */
const RECIPE=[{id:'gs',name:'Glimmerstone',n:1},{id:'gd',name:'Glimmer Dust',n:20,img:'Glimmer Dust'}];
const FEE=250e3;                                      // Yang taken by the NPC for every Gaya
const IMG='/upgrade-cost/images/';                    // pictures are shared with Upgrade Cost (Glimmerstone.webp, "Glimmer Dust.webp", Gaya.webp, Yang.webp)

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const ini=n=>(n.match(/\b[A-Z]/g)||[]).join('').slice(0,2);
/* money input accepts 1450, 1.45k, 2.3kk, 3.12kkk (k=thousand, kk=million, kkk=billion) */
const parseMoney=s=>{const m=String(s).trim().toLowerCase().replace(/\s/g,'').replace(/,/g,'.').match(/^(\d*\.?\d+|\d+\.)(k{0,3})$/);return m?+(parseFloat(m[1])*Math.pow(1000,m[2].length)).toFixed(4):null};
const fmt=n=>{const a=Math.abs(n),u=a>=1e9?[1e9,'kkk']:a>=1e6?[1e6,'kk']:a>=1e3?[1e3,'k']:[1,''];return +(n/u[0]).toFixed(3)+u[1]};
const full=n=>Math.round(n).toLocaleString('de-DE');
const money=n=>full(n)+' ('+fmt(n)+')';
const slot=(name,file)=>`<span class="slot"><i>${ini(name)}</i><img src="${IMG}${encodeURIComponent(file||name.replace(/ /g,'_'))}.webp" alt="" onload="this.classList.add('ok')" onerror="this.parentNode.classList.add('no');this.remove()"></span>`;

/* ===== state (saved in the browser) ===== */
const KEY='lirinGayaV1';
let S={price:{},qty:1},timer;
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object'){if(r.price&&typeof r.price==='object')S.price=r.price;S.qty=Math.min(9999,Math.max(1,parseInt(r.qty,10)||1))}}catch(e){}
const flush=()=>{clearTimeout(timer);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{clearTimeout(timer);timer=setTimeout(flush,250)};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ===== draw the static parts once, so typing never redraws pictures ===== */
$('note').textContent='1 Gaya = '+RECIPE.map(r=>r.n+' '+r.name).join(' + ')+' + '+fmt(FEE)+' Yang (NPC fee)';
$('prices').innerHTML=RECIPE.map(r=>`<div class="prow"><div class="pin"><label><input data-pr="${r.id}" inputmode="decimal" placeholder="Write the Unit Price" value="${S.price[r.id]?fmt(S.price[r.id]):''}" aria-label="Unit price of ${r.name}"><em>Yang</em></label><div class="pn">${slot(r.name,r.img)}<span>${r.name}</span><span class="qn">×${r.n}</span></div></div><div class="pv"><div class="u">Unit : <span id="u-${r.id}"></span></div><div class="t">Total : <span id="t-${r.id}"></span></div></div></div>`).join('');
$('rows').innerHTML=RECIPE.map(r=>`<div class="tr"><span class="nm">${slot(r.name,r.img)}${r.name}</span><span id="a-${r.id}"></span><span class="fl" id="c-${r.id}"></span></div>`).join('')
  +`<div class="tr"><span class="nm">${slot('Yang')}NPC fee</span><span>1 × ${fmt(FEE)}</span><span class="fl">${money(FEE)}</span></div>`
  +`<div class="tr sum"><span class="nm">${slot('Gaya')}Cost per Gaya</span><span></span><span class="fl" id="c-one"></span></div>`
  +`<div class="tr sum" id="r-all"><span class="nm">Total for <span id="n-q"></span> Gaya</span><span></span><span class="fl" id="c-all"></span></div>`;
$('qty').value=S.qty;

/* ===== calculation ===== */
function paint(){
  let mats=0;
  for(const r of RECIPE){
    const p=S.price[r.id]||0,t=p*r.n;mats+=t;
    $('u-'+r.id).textContent=fmt(p);$('t-'+r.id).textContent=fmt(t);
    $('a-'+r.id).textContent=r.n+' × '+fmt(p);$('c-'+r.id).textContent=money(t);
  }
  const one=mats+FEE,all=one*S.qty;
  $('c-one').textContent=money(one);$('c-all').textContent=money(all);$('n-q').textContent=S.qty;
  $('r-all').hidden=S.qty===1;
  $('s-m').textContent=money(mats);$('s-f').textContent=money(FEE);$('s-t').textContent=money(one);
  $('s-ql').textContent='Total ×'+S.qty+' :';$('s-n').textContent=money(all);
}

/* ===== events ===== */
document.addEventListener('input',e=>{
  const t=e.target,id=t.dataset.pr;
  if(id){                                            // unit price: accepts 1450, 1.45k, 2.3kk ...
    const v=t.value.trim()?parseMoney(t.value):0;
    t.closest('.pin').classList.toggle('bad',v===null);
    if(v===null)return;
    S.price[id]=v;save();paint();
  }else if(t.id==='qty'){                            // number of Gaya typed by hand
    S.qty=Math.min(9999,Math.max(1,parseInt(t.value.replace(/\D/g,''),10)||1));save();paint();
  }
});
document.addEventListener('change',e=>{if(e.target.id==='qty')e.target.value=S.qty});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  S.qty=Math.min(9999,Math.max(1,S.qty+(b.dataset.a==='qp'?1:-1)));
  $('qty').value=S.qty;save();paint();
});
paint();
</script>
</body>
</html>
