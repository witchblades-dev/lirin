<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upgrade Cost Calculator — LIRIN</title>

<meta name="description" content="Pick an item, toggle the upgrade steps you need and see the exact materials and total cost.">

<meta name="theme-color" content="#0f1013">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1013'/%3E%3Cpath d='M20 14v36h26' fill='none' stroke='%23c7a76b' stroke-width='5' stroke-linecap='square'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{--gold:#c7a76b;--bg:#0f1013;--line:rgba(255,255,255,.075);--text:#f3f0e9;--muted:#a6a5a8;--dim:#8a8a92;--green:#46d081;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}

*{box-sizing:border-box}

html{scrollbar-color:#414149 #101115}

body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}

button,input{font:inherit;color:inherit}

.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app-root{display:flex;min-height:100svh;background:linear-gradient(138deg,#121318 0%,#191a20 50%,#0e0f12 100%)}

.sidebar{position:sticky;top:0;z-index:6;flex:0 0 260px;align-self:flex-start;height:100svh;display:flex;flex-direction:column;gap:6px;padding:34px 18px;background:#121318;border-right:1px solid var(--line)}

.nav-label{margin:0 12px 16px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.08);color:#a9a7a0;font-size:.8rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase}

.nav-item{display:flex;align-items:center;gap:11px;min-height:46px;padding:0 14px;border:1px solid transparent;border-radius:9px;color:#aaaab0;font-size:.9rem;font-weight:500;text-decoration:none;transition:color .18s,background .18s,border-color .18s}

.nav-item .ic{width:17px;height:17px;flex:none;color:#777982}

.nav-item:hover,.nav-item.is-active{color:#f1e8d7;border-color:rgba(199,167,107,.16);background:rgba(199,167,107,.075)}

.nav-item:hover .ic,.nav-item.is-active .ic{color:var(--gold)}

.nav-item.is-soon,.nav-item.is-soon:hover{color:#8d8d94;border-color:transparent;background:none;cursor:default}

.nav-item.is-soon .ic{color:#5f6169}

.badge{margin-left:auto;padding:2px 8px;border:1px solid rgba(255,255,255,.12);border-radius:20px;color:var(--dim);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}



.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100svh}

.inner{width:min(100%,1000px);margin:0 auto;padding:clamp(34px,6vh,60px) clamp(14px,3vw,30px) 40px}

h1{margin:0;text-align:center;font-family:var(--serif);font-size:clamp(2rem,4.4vw,2.9rem);font-weight:600;letter-spacing:.1em;background:linear-gradient(180deg,#f5eddd,#d6bd8c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.line{width:min(420px,70%);height:1px;margin:14px auto 18px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.note{margin:0 auto 22px;max-width:560px;padding:10px 16px;border:1px solid rgba(199,167,107,.22);border-radius:9px;background:rgba(199,167,107,.06);color:#d9c59b;font-size:.84rem;text-align:center}

.tabs,.items,.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.tabs{width:100%;margin:0 0 30px;gap:0 6px;border-bottom:1px solid rgba(255,255,255,.1)}

.items{margin-bottom:20px}

.steps{flex-wrap:nowrap;gap:6px;margin-bottom:6px;padding:12px 14px;border:1px solid rgba(70,208,129,.22);border-radius:16px;background:rgba(70,208,129,.04)}

.lbl{flex:0 0 100%;margin-bottom:2px;color:var(--dim);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-align:center;text-transform:uppercase}

.tab{position:relative;padding:15px 20px 17px;border:0;background:none;color:#8f8e94;font-family:var(--serif);font-size:1.12rem;font-weight:600;letter-spacing:.14em;cursor:pointer;transition:color .2s,background .2s}

.tab::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:2px;background:var(--gold);box-shadow:0 0 14px rgba(199,167,107,.75);transform:scaleX(0);transition:transform .28s cubic-bezier(.2,.8,.2,1)}

.tab:hover::after{transform:scaleX(.45)}

.tab:hover{color:#e9e2d2}

.tab.on{color:#f1dfb4;background:linear-gradient(180deg,transparent,rgba(199,167,107,.11))}

.tab.on::after{transform:scaleX(1)}

.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#17181d;color:#b8b6b1;font-size:.83rem;cursor:pointer;transition:border-color .18s,background .18s}

.pill:hover{border-color:rgba(199,167,107,.3)}

.pill.on{border-color:var(--gold);color:#f1e8d7;background:rgba(199,167,107,.1)}

.rc{position:relative;width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid #7a7c84}

.on>.rc{background:var(--gold);border-color:var(--gold)}

.on>.rc::after{content:"";position:absolute;left:4px;top:1px;width:3px;height:7px;border:solid #1b1405;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}

.empty{width:100%;margin:14px 0;text-align:center;color:var(--dim);font-size:.9rem}

.sp{display:inline-flex;flex:none;align-items:center;gap:6px;padding:9px 12px;border:1.5px solid rgba(255,255,255,.16);border-radius:999px;background:#14151a;color:#b9b8bd;font-size:.9rem;font-weight:700;cursor:pointer;transition:border-color .18s,background .18s,color .18s,box-shadow .18s}

.sp:hover{border-color:rgba(70,208,129,.55);color:#fff}

.sp.on{border-color:var(--green);background:rgba(70,208,129,.13);color:#9af3c0;box-shadow:0 0 16px rgba(70,208,129,.2)}

.sp.on>.rc{background:var(--green);border-color:var(--green)}

.sp.all{margin-right:6px;padding:9px 16px;border-style:dashed;border-color:rgba(199,167,107,.55);color:#e6d2a7;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}

.sp.all.on{border-style:solid;border-color:var(--gold);background:rgba(199,167,107,.12);color:#f1e8d7;box-shadow:none}

.sp.all.on>.rc{background:var(--gold);border-color:var(--gold)}

.sp .rc{width:12px;height:12px}

.sp .rc::after{left:3px;top:0;width:3px;height:6px}

@media(max-width:1250px){.steps{flex-wrap:wrap}}

@media(max-width:700px){.tab{padding:11px 12px;font-size:.92rem;letter-spacing:.1em}}



details.panel{margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#16171c}

summary{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#22242b;font-weight:600;cursor:pointer;list-style:none}

summary::-webkit-details-marker{display:none}

summary::before{content:"▾";color:var(--gold);transition:transform .18s}

details:not([open]) summary::before,details[data-st="closed"] summary::before{transform:rotate(-90deg)}

summary{transition:background .18s}

summary:hover{background:#2a2c34}

.dc{overflow:hidden}

.tr{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr minmax(120px,.8fr);gap:14px;align-items:center;padding:14px 18px}

.tr:nth-child(even){background:rgba(255,255,255,.03)}

.tr.th{color:var(--dim);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;background:none!important}

.tr.off{opacity:.32}

.nm{font-size:.88rem;font-weight:500}

.nm small{display:block;margin-top:2px;color:var(--gold);font-size:.8rem}

.mats{display:flex;flex-wrap:wrap;gap:16px}

.mat{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:#26282f;color:#d6bd8c;font-size:.74rem;font-weight:600}

.mat i{font-style:normal}

.mat.hi i{display:none}

.mg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}

.ii{width:26px;height:26px;object-fit:contain;flex:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px, 172px));justify-content:center;gap:12px;width:100%}

.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 10px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#1d1e24,#16171c);color:#d6d3cc;font-size:.9rem;font-weight:600;line-height:1.3;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s,color .2s}

.tile .rc{position:absolute;top:12px;left:12px;width:18px;height:18px}

.tile .rc::after{left:5px;top:2px;width:4px;height:8px}

.pic{position:relative;display:grid;place-items:center;width:100%;height:118px}

.pic img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));transition:transform .25s}

.ph{position:absolute;font-family:var(--serif);font-size:2rem;color:#5d5a52}

.pic.hi .ph{display:none}

.tile:hover{transform:translateY(-3px);border-color:rgba(199,167,107,.45)}

.tile:hover .pic img{transform:scale(1.08)}

.tile.on{border-color:var(--gold);color:#f6e9c9;background:linear-gradient(180deg,rgba(199,167,107,.2),rgba(199,167,107,.05));box-shadow:0 0 0 1px var(--gold),0 14px 34px rgba(199,167,107,.16)}

.mat.y{border-color:rgba(199,167,107,.45)}

.mat b{position:absolute;right:-8px;bottom:-8px;min-width:21px;padding:1px 5px;border-radius:10px;background:#1f9d4c;color:#fff;font-size:.66rem;font-weight:600;text-align:center}

.ed{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:.75rem;font-weight:600}

.ed input,.pin input{padding:7px 9px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:#12141a;font-size:.84rem}

.ed input{width:72px}

.fl{justify-self:end;text-align:center}

.fail{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#1b1c22}

.fail button{width:34px;height:34px;border:0;background:none;font-size:1.1rem;cursor:pointer}

.fail button:hover{color:var(--gold)}

.fail b{min-width:34px;text-align:center;font-weight:500}

.fl small{display:block;margin-top:5px;color:var(--dim);font-size:.7rem}

.pbody{padding:16px 18px 8px}

.btn{padding:9px 16px;border:1px solid rgba(199,167,107,.35);border-radius:8px;background:rgba(199,167,107,.08);color:#e6d2a7;font-size:.82rem;font-weight:600;cursor:pointer}

.btn:hover{background:rgba(199,167,107,.15)}

.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:9px;background:rgba(255,255,255,.035)}

.pin{width:min(100%,310px)}

.pin label{display:flex;align-items:center;gap:8px;padding-right:12px;border:1px solid var(--line);border-radius:8px;background:#22242b}

.pin input{flex:1;min-width:0;border:0;background:none}

.pin em{color:var(--dim);font-size:.8rem;font-style:normal}

.pn{display:flex;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font-size:.78rem}

.mi{width:20px;height:20px;object-fit:contain}

.pv{font-size:.9rem;line-height:1.7}

.u{color:#e0875a}.t{color:var(--green)}



/* always-visible cost bar */

.summary{position:sticky;bottom:0;z-index:5;margin-top:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px clamp(18px,4vw,52px);padding:14px 20px;background:rgba(15,16,19,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(199,167,107,.28);box-shadow:0 -14px 34px rgba(0,0,0,.45)}

.summary div{display:flex;align-items:baseline;gap:10px}

.summary span{color:var(--dim);font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.summary b{color:#e6d2a7;font-size:1rem;font-weight:600}

.summary .tot b{color:var(--green);font-size:1.15rem}



:focus-visible{outline:2px solid #d8bd83;outline-offset:3px}

@media(max-width:700px){

  .app-root{flex-direction:column}

  .sidebar{position:relative;flex:none;width:100%;height:auto;flex-direction:row;align-items:center;gap:7px;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}

  .nav-label{flex:none;margin:0 8px 0 2px;padding:0;border:0;font-size:.7rem}

  .nav-item{flex:none;min-height:36px;gap:7px;padding:0 9px;font-size:.78rem;white-space:nowrap}

  .badge{display:none}

  .tr{grid-template-columns:1fr}.tr.th{display:none}.fl{justify-self:start}

  .summary{padding:10px 12px;gap:4px 16px}

  .summary div{flex-direction:column;gap:0;align-items:center}

}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

</style>

<div class="app-root">

  <nav class="sidebar" aria-label="Main navigation">

    <p class="nav-label">Lirin Tools</p>

    <a class="nav-item" href="/"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Home</a>

    <a class="nav-item is-active" href="/upgrade-cost/" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-upgrade"/></svg>Upgrade Cost</a>

  </nav>

  <main class="main">

    <div class="inner" id="app"></div>

    <div class="summary" aria-live="polite">

      <div><span>Lager Cost :</span><b id="s-l">0 (0)</b></div>

      <div><span>Material Cost :</span><b id="s-m">0 (0)</b></div>

      <div class="tot"><span>Total Cost :</span><b id="s-t">0 (0)</b></div>

    </div>

<script>

/* ===== DATA — add more items here: DATA['Item name']=[ten steps +0..+9, each {m:{materialId:count},y:yangFee}] ===== */

const CATS=['WEAPONS','ARMOURS','HELMETS','SHIELDS','EARRINGS','BRACELET','NECKLACE','SHOES','BELTS'];
const LIST=[[], [], [], [], [], ['Heaven\'s Tear Bracelet', 'Soul Crystal Bracelet', 'Onyx Bracelet'], [], [], []];
const MAT = {};
const DATA = {};

const E = () => ({ m: {}, y: 0 });


/* ===== helpers (money accepts 1450, 1.45k, 2.3kk, 3.12kkk) ===== */

const $=id=>document.getElementById(id);

const parseMoney=s=>{const m=String(s).trim().toLowerCase().replace(/\s/g,'').replace(/,/g,'.').match(/^(\d*\.?\d+|\d+\.)(k{0,3})$/);return m?+(parseFloat(m[1])*Math.pow(1000,m[2].length)).toFixed(4):null};

const fmt=n=>{const a=Math.abs(n),u=a>=1e9?[1e9,'kkk']:a>=1e6?[1e6,'kk']:a>=1e3?[1e3,'k']:[1,''];return +(n/u[0]).toFixed(3)+u[1]};

const full=n=>Math.round(n).toLocaleString('de-DE');

const money=n=>full(n)+' ('+fmt(n)+')';

const ini=n=>n.split(' ').filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join('').slice(0,2);

/* pictures live in upgrade-cost/image/<name>.png ; a missing file is simply skipped */

const IMGBASE=(()=>{const u=location.href.split(/[?#]/)[0];return(/\/$|\.[a-z0-9]+$/i.test(u)?u.replace(/[^\/]*$/,''):u+'/')+'image/'})();

const IC = 'https://metin2cms.cf/items/img/icons/';
  
const PIC = {
'Heaven\'s Tear Bracelet': '14200.png',
  'Soul Crystal Bracelet': '14220.png',
  'Onyx Bracelet': 'images/Onyx_Bracelet.webp'
};

const img = (n, c) => {
  const iconFile = PIC[n];
  const url = iconFile
    ? (n === 'Onyx Bracelet'
        ? iconFile
        : IC + iconFile)
    : '';

  if (!url) return '';

  return `<img class="${c}" src="${url}" alt="${n}" referrerpolicy="no-referrer" onerror="this.remove()" onload="imgLoad(this)">`;
};



/* ===== state ===== */

const KEY='lirinUpgradeV1';

const def=()=>({cat:1,item:'Magma Storm Armour',off:{},fails:{},price:{},ov:{},edit:false,o:{d:1,p:1}});

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r)return Object.assign(def(),r)}catch(e){}return def()}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load();



function step(i){

  const b=DATA[S.item]&&DATA[S.item][i];if(!b)return null;

  const g=(k,v)=>{const o=S.ov[S.item+':'+i+':'+k];return o==null?v:o},m={};

  for(const k in b.m)m[k]=g(k,b.m[k]);

  return{m,y:g('y',b.y),base:b};

}

const att=i=>1+(i>=7?(S.fails[S.item+':'+i]||0):0);

function calc(){

  const R={c:{},lager:0,mat:0};

  for(let i=0;i<10;i++){

    const s=step(i);if(!s||S.off[i])continue;

    const a=att(i);R.lager+=s.y*a;

    for(const k in s.m)R.c[k]=(R.c[k]||0)+s.m[k]*a;

  }

  for(const k in R.c)R.mat+=R.c[k]*(S.price[k]||0);

  R.total=R.lager+R.mat;return R;

}

function paint(){

  const R=calc();

  $('s-l').textContent=money(R.lager);$('s-m').textContent=money(R.mat);$('s-t').textContent=money(R.total);

  for(const k in R.c){const u=$('u-'+k),t=$('t-'+k);if(u){u.textContent=full(S.price[k]||0);t.textContent=full(R.c[k]*(S.price[k]||0))}}

}



function itemsHtml(){

  const L=LIST[S.cat];

  if(!L.length)return'<p class="empty">No items in this category yet.</p>';

  const tiles=L.some(n=>PIC[n]);

  const btn=n=>{const on=n===S.item,at=`data-a="item" data-v="${n}" aria-pressed="${on}"`;

    return tiles?`<button class="tile${on?' on':''}" ${at}><i class="rc"></i><span class="pic"><span class="ph">${ini(n)}</span>${img(n,'tp')}</span>${n}</button>`

    :`<button class="pill${on?' on':''}" ${at}><i class="rc"></i>${img(n,'ii')}${n}</button>`};

  return tiles?`<div class="tiles">${L.map(btn).join('')}</div>`:L.map(btn).join('');

}

function render(){

  const R=calc(),idx=[...Array(10).keys()],allOn=idx.every(i=>!S.off[i]),data=DATA[S.item];

  let h=`<h1>UPGRADE COST CALCULATOR</h1><div class="line"></div>

  <p class="note">Note: In some items, the required lagers are not calculated.</p>

  <div class="tabs">${CATS.map((c,i)=>`<button class="tab${i===S.cat?' on':''}" data-a="cat" data-v="${i}" aria-pressed="${i===S.cat}">${c}</button>`).join('')}</div>

  <div class="items"><div class="lbl">Choose item</div>${itemsHtml()}</div>

  <div class="steps"><button class="sp all${allOn?' on':''}" data-a="all"><i class="rc"></i>${allOn?'Click to Deactivate All':'Click to Activate All'}</button>${idx.map(i=>`<button class="sp${S.off[i]?'':' on'}" data-a="st" data-v="${i}" aria-pressed="${!S.off[i]}"><i class="rc"></i>+${i}</button>`).join('')}</div>

  <details class="panel" data-p="d"${S.o.d?' open':''}><summary>Details</summary><div class="dc">

  <div class="tr th"><span>Name</span><span>Materials</span><span class="fl">Fail Time(s)</span></div>`;

  if(!data)h+='<p class="empty">No upgrade data for this item yet.</p>';

  else idx.forEach(i=>{

    const s=step(i),f=S.fails[S.item+':'+i]||0;

    let body='';

    if(S.edit){

      body=Object.keys(s.m).map(k=>`<label class="ed">${ini(MAT[k])}<input data-f="${i}:${k}" value="${s.m[k]}" inputmode="decimal" aria-label="${MAT[k]}"></label>`).join('');

      if(s.base.y>0)body+=`<label class="ed">Yang<input data-f="${i}:y" value="${fmt(s.y)}" inputmode="decimal" aria-label="Yang fee"></label>`;

    }else{

      body=Object.keys(s.m).map(k=>`<span class="mat" title="${MAT[k]}"><i>${ini(MAT[k])}</i>${img(MAT[k],'mg')}${s.m[k]>0?`<b>${s.m[k]}</b>`:''}</span>`).join('');

      if(s.y>0)body+=`<span class="mat y" title="Yang"><i>Y</i><b>${fmt(s.y)}</b></span>`;

    }

    h+=`<div class="tr${S.off[i]?' off':''}"><span class="nm">${S.item}<small>+${i}</small></span><span class="mats">${body}</span><span class="fl">${i>=7?`<div class="fail"><button data-a="fm" data-v="${i}" aria-label="Fewer fails">−</button><b>${f}</b><button data-a="fp" data-v="${i}" aria-label="More fails">+</button></div><small>Write a fail time(s)</small>`:''}</span></div>`;

  });

  h+=`</div></details>

  <details class="panel" data-p="p"${S.o.p?' open':''}><summary>Material Prices</summary><div class="dc"><div class="pbody">

  <button class="btn" data-a="edit">${S.edit?'Close':'Open'} edit material count mode</button>`;

  Object.keys(R.c).forEach(k=>{

    h+=`<div class="prow"><div class="pin"><label><input data-pr="${k}" inputmode="decimal" placeholder="Write the Unit Price" value="${S.price[k]?fmt(S.price[k]):''}" aria-label="Unit price of ${MAT[k]}"><em>Yang</em></label><div class="pn">${img(MAT[k],'mi')}${R.c[k]?R.c[k]+'x ':''}${MAT[k]}</div></div>

    <div class="pv"><div class="u">Unit : <span id="u-${k}">${full(S.price[k]||0)}</span></div><div class="t">Total : <span id="t-${k}">${full(R.c[k]*(S.price[k]||0))}</span> Lager</div></div></div>`;

  });

  if(!Object.keys(R.c).length)h+='<p class="empty">No materials for the selected steps.</p>';

  h+='</div></div></details>';

  $('app').innerHTML=h;paint();

}



document.addEventListener('click',e=>{

  const el=e.target.closest('[data-a]');if(!el)return;

  const a=el.dataset.a,v=el.dataset.v,k=S.item+':'+v;

  if(a==='cat'){S.cat=+v;S.item=LIST[S.cat][0]||null}

  else if(a==='item')S.item=v;

  else if(a==='all'){const on=[...Array(10).keys()].every(i=>!S.off[i]);S.off={};if(on)for(let i=0;i<10;i++)S.off[i]=1}

  else if(a==='st'){if(S.off[v])delete S.off[v];else S.off[v]=1}

  else if(a==='fm')S.fails[k]=Math.max(0,(S.fails[k]||0)-1);

  else if(a==='fp')S.fails[k]=Math.min(999,(S.fails[k]||0)+1);

  else if(a==='edit')S.edit=!S.edit;

  save();render();

});

document.addEventListener('input',e=>{

  const k=e.target.dataset&&e.target.dataset.pr;if(!k)return;

  const t=e.target.value.trim(),v=t?parseMoney(t):0;

  if(v===null)return;

  S.price[k]=v;save();paint();

});

document.addEventListener('change',e=>{

  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;

  const [i,m]=f.split(':'),key=S.item+':'+i+':'+m,v=parseMoney(e.target.value);

  if(v===null)delete S.ov[key];else S.ov[key]=v;

  save();render();

});

document.addEventListener('toggle',e=>{

  const p=e.target.dataset&&e.target.dataset.p;

  if(p){S.o[p]=e.target.open?1:0;save()}

},true);

document.addEventListener('click',e=>{

  const sm=e.target.closest('summary');if(!sm)return;

  e.preventDefault();

  const d=sm.parentElement,c=d.querySelector('.dc'),opening=!d.open||d.dataset.st==='closed';

  const h0=d.open?c.offsetHeight:0,o0=d.open?+getComputedStyle(c).opacity:0;

  if(d._a)d._a.cancel();

  d.dataset.st=opening?'open':'closed';

  d.open=true;

  const t=matchMedia('(prefers-reduced-motion: reduce)').matches?1:opening?320:220;

  const a=c.animate({height:[h0+'px',(opening?c.scrollHeight:0)+'px'],opacity:[o0,opening?1:0]},{duration:t,easing:opening?'cubic-bezier(.2,.8,.2,1)':'cubic-bezier(.4,0,.6,1)',fill:'forwards'});

  d._a=a;

  a.onfinish=()=>{if(!opening)d.open=false;a.cancel();if(d._a===a)d._a=null};

});

render();

</script>

</body>

</html>
