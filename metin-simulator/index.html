<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Simulator — LIRIN</title>
<meta name="description" content="Set your DPS and session length and see what a metin drops, what it transforms into and what it is worth.">
<meta name="theme-color" content="#0f1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1013'/%3E%3Cpath d='M20 14v36h26' fill='none' stroke='%23c7a76b' stroke-width='5' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
.note{margin:0 auto 22px;max-width:620px;padding:10px 16px;border:1px solid rgba(199,167,107,.22);border-radius:9px;background:rgba(199,167,107,.06);color:#d9c59b;font-size:.84rem;text-align:center}
.panel{margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#16171c}
.panel h2{margin:0;padding:14px 18px;background:#22242b;font-size:1rem;font-weight:600}
.pbody{padding:16px 18px 18px}
.slot{position:relative;display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:linear-gradient(180deg,#2b2d35,#202228);color:#d6bd8c;font-size:.7rem;font-weight:600}
.slot img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;transition:opacity .15s}
.slot>i{display:none;font-style:normal}.slot.no>i{display:block}
img:not(.ok){opacity:0}

/* character */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cb{display:flex;flex-direction:column;gap:7px;min-width:0}
.cb>span{color:var(--dim);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.qe{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#1b1c22}
.qe button{flex:none;width:38px;height:42px;border:0;background:none;font-size:1.2rem;cursor:pointer}.qe button:hover{color:var(--gold)}
.qe input{flex:1;width:0;min-width:0;padding:6px;border:0;background:none;text-align:center;font-size:1.05rem;font-weight:600}
.btn{margin-top:14px;padding:9px 16px;border:1px solid rgba(199,167,107,.35);border-radius:8px;background:rgba(199,167,107,.08);color:#e6d2a7;font-size:.82rem;font-weight:600;cursor:pointer}.btn:hover{background:rgba(199,167,107,.15)}

/* metin picker */
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mtile{padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,#1d1e24,#16171c);color:#a6a5a8;font-size:.78rem;line-height:1.6;text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.mtile b{display:block;color:#ece4d3;font-size:.9rem}
.mtile:not(.soon):hover{border-color:rgba(199,167,107,.45)}
.mtile.on{border-color:var(--gold);background:rgba(199,167,107,.12);box-shadow:0 0 0 1px var(--gold)}
.mtile.soon{opacity:.55;border-style:dashed;cursor:default}
.hint{margin:12px 0 0;color:var(--dim);font-size:.78rem}

/* result */
.stats{display:flex;flex-wrap:wrap;gap:12px 34px;margin-bottom:16px}
.stats span,.vb span{display:block;color:var(--dim);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stats b{color:#e6d2a7;font-size:1.1rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-align:right;text-transform:uppercase}
td{padding:9px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(odd){background:rgba(255,255,255,.03)}
td small{display:block;font-size:.68rem}
.nm{display:flex;align-items:center;gap:10px;font-weight:500}
.b{color:#e6d2a7;font-weight:600}
.tf{color:var(--green)}.tf .nm{justify-content:flex-end}
.t-g{color:var(--dim)}.t-c{color:var(--green)}.t-r{color:#6fb1ff}.t-l{color:#e0a64a}.t-m{color:#ff6b6b}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.vb{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#1b1c22}
.vb b{color:#e6d2a7;font-size:1.3rem}.vb.g b{color:var(--green)}

/* prices */
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:9px;background:rgba(255,255,255,.035)}
.prow:first-child{margin-top:0}
.pin{width:min(100%,310px);overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#22242b}
.pin.bad{border-color:#e0875a}
.pin label{display:flex;align-items:center;gap:8px;padding-right:14px}
.pin input{flex:1;min-width:0;padding:12px 14px;border:0;background:none;font-size:.95rem}.pin em{color:var(--dim);font-size:.85rem;font-style:normal}
.pn{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#1b1c22;color:var(--muted);font-size:.8rem}
.pv{font-size:.9rem;line-height:1.7}.u{color:#e0875a}.t{color:var(--green)}
.summary .who b{color:var(--gold);font-family:var(--serif);font-size:1.1rem}

@media(max-width:700px){.vals{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-root">
  <nav id="sidebar"></nav>
  <script src="/nav.js"></script>
  <main class="main">
    <div class="inner">
      <h1>METIN SIMULATOR</h1><div class="line"></div>
      <p class="note">Every drop is rolled at random, so each run is a little different. Only Lv. 70 is available for now.</p>
      <section class="panel"><h2>Your Character</h2><div class="pbody">
        <div class="chars">
          <div class="cb"><div class="qe"><button data-k="dps" data-s="-1" aria-label="Less">−</button><input data-k="dps" inputmode="numeric" maxlength="7" aria-label="Average DPS"><button data-k="dps" data-s="1" aria-label="More">+</button></div><span>Average DPS</span></div>
          <div class="cb"><div class="qe"><button data-k="min" data-s="-1" aria-label="Less">−</button><input data-k="min" inputmode="numeric" maxlength="4" aria-label="Session in minutes"><button data-k="min" data-s="1" aria-label="More">+</button></div><span>Session (min)</span></div>
          <div class="cb"><div class="qe"><button data-k="trv" data-s="-1" aria-label="Less">−</button><input data-k="trv" inputmode="numeric" maxlength="3" aria-label="Travel time in seconds"><button data-k="trv" data-s="1" aria-label="More">+</button></div><span>Travel time (sec)</span></div>
        </div>
        <button class="btn" data-a="roll">Roll again</button>
      </div></section>
      <section class="panel"><h2>Pick a Metin</h2><div class="pbody"><div class="mt" id="pick"></div>
        <p class="hint">Pick up to two metins and each gets its own result. More metins are on the way.</p></div></section>
      <div id="sims"></div>
      <section class="panel"><h2>Material Prices</h2><div class="pbody" id="prices"></div></section>
    </div>
    <div class="summary" id="sum" aria-live="polite"></div>
  </main>
</div>
<script>
/* ===== data: add a metin by copying the Murder block (drop = [name, chance %, min, max, tier, extra]) ===== */
const METINS=[
  {id:'murder',name:'Lv. 70 Metin of Murder',hp:296550,drops:[
    ['Torn Page',100,1,2,'g'],
    ['Yang Coupon 40000',100,1,2,'g',{yang:40000}],            // each coupon = 40.000 Yang
    ['Amethyst Fragment',100,1,1,'g',{to:'Amethyst Crystal'}],  // FRAG fragments = 1 crystal
    ['Glimmer Dust',50,1,2,'c'],
    ['Enchant Item',50,1,1,'c'],
    ['Murder Fragment',25,1,1,'r',{to:'Murder Rock'}],
    ['Blessing Scroll',8,1,1,'l'],
    ['Stone Shard',4,1,2,'m'],
    ['Soul Stone',4,1,1,'m']]},
  {id:'jeon',name:'Lv. 90 Metin Jeon-Un',hp:905000,soon:1},
  {id:'manti',name:'Lv. 105 Manticore Metin',hp:1800000,soon:1},
  {id:'forest',name:'Lv. 110 Metin of the Forests',hp:4000000,soon:1}
];
const TIER={g:'Guaranteed',c:'Common',r:'Rare',l:'Legendary',m:'Mystic'};
const FRAG=10;
const LIM={dps:[1,9999999],min:[1,1440],trv:[0,600]},STEP={dps:1000,min:10,trv:1};
/* pictures: /images/<name>.webp, see lirinImg() in /nav.js */

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const BY=Object.fromEntries(METINS.map(m=>[m.id,m]));
const ini=n=>(n.match(/\b[A-Z]/g)||[]).join('').slice(0,2);
/* money input accepts 1450, 1.45k, 2.3kk, 3.12kkk (k=thousand, kk=million, kkk=billion) */
const parseMoney=s=>{const m=String(s).trim().toLowerCase().replace(/\s/g,'').replace(/,/g,'.').match(/^(\d*\.?\d+|\d+\.)(k{0,3})$/);return m?+(parseFloat(m[1])*Math.pow(1000,m[2].length)).toFixed(4):null};
const fmt=n=>{const a=Math.abs(n),u=a>=1e9?[1e9,'kkk']:a>=1e6?[1e6,'kk']:a>=1e3?[1e3,'k']:[1,''];return +(n/u[0]).toFixed(3)+u[1]};
const full=n=>Math.round(n).toLocaleString('de-DE');
const money=n=>full(n)+' ('+fmt(n)+')';
const slot=n=>`<span class="slot"><i>${ini(n)}</i><img src="${lirinImg(n)}" alt="" onload="this.classList.add('ok')" onerror="this.parentNode.classList.add('no');this.remove()"></span>`;
const clamp=(k,v)=>Math.min(LIM[k][1],Math.max(LIM[k][0],Math.round(v)||0));

/* ===== state (saved in the browser) ===== */
const KEY='lirinMetinV1';
let S={dps:90000,min:150,trv:0,sel:['murder'],price:{}},timer,RUN={},NAMES=[];
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object'){
  for(const k in LIM)if(Number.isFinite(+r[k]))S[k]=clamp(k,+r[k]);
  if(Array.isArray(r.sel)){const s=r.sel.filter(id=>BY[id]&&!BY[id].soon).slice(0,2);if(s.length)S.sel=s}
  if(r.price&&typeof r.price==='object')S.price=r.price}}catch(e){}
const flush=()=>{clearTimeout(timer);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{clearTimeout(timer);timer=setTimeout(flush,250)};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ===== simulation ===== */
function roll(m){                                  // one session: metins killed in the time, then every drop rolled per metin
  const n=Math.floor(S.min*60/(m.hp/S.dps+S.trv)),cnt={};
  for(const[d,ch,lo,hi]of m.drops){let c=0;
    for(let i=0;i<n;i++)if(ch>=100||Math.random()*100<ch)c+=lo+Math.floor(Math.random()*(hi-lo+1));
    cnt[d]=c}
  return{n,cnt};
}
function derive(m,r){                              // items you can sell + Yang from coupons
  const items={};let yang=0;
  for(const[d,,,,,x]of m.drops){const c=r.cnt[d];
    if(x&&x.yang)yang+=c*x.yang;else if(x&&x.to)items[x.to]=Math.floor(c/FRAG);else items[d]=c}
  return{items,yang};
}
const metins=()=>S.sel.map(id=>BY[id]);
const rollAll=()=>{RUN={};metins().forEach(m=>RUN[m.id]=roll(m))};

/* ===== drawing ===== */
function drawInputs(){document.querySelectorAll('input[data-k]').forEach(i=>{if(document.activeElement!==i)i.value=S[i.dataset.k]})}
function drawPick(){
  $('pick').innerHTML=METINS.map(m=>{
    const t=(m.hp/S.dps).toFixed(1);
    const body=`<b>${m.name}</b>Health: ${full(m.hp)}<br>Time to destroy: ${t}s`;
    return m.soon?`<div class="mtile soon">${body}<br>Coming soon</div>`:`<button class="mtile${S.sel.includes(m.id)?' on':''}" data-id="${m.id}" aria-pressed="${S.sel.includes(m.id)}">${body}</button>`;
  }).join('');
}
function drawSims(){
  $('sims').innerHTML=metins().map(m=>{
    const r=RUN[m.id],rows=m.drops.map(([d,ch,lo,hi,t,x])=>{
      const c=r.cnt[d];let tf='<span class="t-g">–</span>';
      if(x&&x.yang)tf=`${fmt(c*x.yang)} Yang`;
      else if(x&&x.to){const l=c%FRAG;tf=`<span class="nm">${slot(x.to)}${full(Math.floor(c/FRAG))}× ${x.to}</span>${l?`<small>+${l} left over</small>`:''}`}
      return`<tr><td><span class="nm">${slot(d)}${d}</span></td><td>${ch}% (${lo}-${hi})<small class="t-${t}">${TIER[t]}</small></td><td class="b">${full(c)}</td><td>${(c*60/S.min).toFixed(2)}</td><td class="tf">${tf}</td></tr>`}).join('');
    return`<section class="panel"><h2>${m.name}</h2><div class="pbody">
      <div class="stats"><div><span>Health</span><b>${full(m.hp)}</b></div><div><span>Time to destroy</span><b>${(m.hp/S.dps).toFixed(1)}s</b></div><div><span>Travel time</span><b>${S.trv}s</b></div><div><span>Destroyed metins</span><b>${full(r.n)}</b></div></div>
      <div class="tw"><table><thead><tr><th>Item</th><th>Chance</th><th>This run</th><th>Per hour</th><th>Transform</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="vals"><div class="vb"><span>Materials value</span><b id="mv-${m.id}"></b></div><div class="vb g"><span>Total gain (materials + Yang)</span><b id="tg-${m.id}"></b></div></div>
    </div></section>`}).join('');
}
function drawPrices(){
  NAMES=[...new Set(metins().flatMap(m=>m.drops.map(([d,,,,,x])=>x&&x.yang?null:(x&&x.to)||d).filter(Boolean)))];
  const ms=metins(),tag=m=>ms.length>1?m.name.match(/Lv\. \d+/)[0]+' · ':'';
  $('prices').innerHTML=NAMES.map((n,i)=>`<div class="prow"><div class="pin"><label><input data-pr="${i}" inputmode="decimal" placeholder="Write the Unit Price" value="${S.price[n]?fmt(S.price[n]):''}" aria-label="Unit price of ${n}"><em>Yang</em></label><div class="pn">${slot(n)}<span>${n}</span></div></div>
    <div class="pv"><div class="u">Unit : <span id="u${i}"></span></div>${ms.map((m,k)=>`<div class="t">${tag(m)}<span id="q${k}_${i}"></span>× = <span id="t${k}_${i}"></span></div>`).join('')}</div></div>`).join('');
}
function paint(){
  let sum='';
  metins().forEach((m,k)=>{
    const r=RUN[m.id],d=derive(m,r);let mat=0;
    for(const n in d.items)mat+=d.items[n]*(S.price[n]||0);
    $('mv-'+m.id).textContent=money(mat);$('tg-'+m.id).textContent=money(mat+d.yang);
    sum+=`<div class="who"><b>${m.name}</b></div><div><span>Destroyed :</span><b>${full(r.n)}</b></div><div><span>Materials :</span><b>${money(mat)}</b></div><div class="tot"><span>Total gain :</span><b>${money(mat+d.yang)}</b></div>`;
    NAMES.forEach((n,i)=>{const q=d.items[n]||0,p=S.price[n]||0;$(`q${k}_${i}`).textContent=full(q);$(`t${k}_${i}`).textContent=fmt(q*p)});
  });
  NAMES.forEach((n,i)=>$('u'+i).textContent=fmt(S.price[n]||0));
  $('sum').innerHTML=sum;
}
const refresh=()=>{rollAll();drawPick();drawSims();paint()};

/* ===== events ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){const k=b.dataset.k;S[k]=clamp(k,S[k]+(+b.dataset.s)*STEP[k]);drawInputs();refresh();save()}
  else if(b.dataset.a==='roll')refresh();
  else if(b.dataset.id){
    const id=b.dataset.id,i=S.sel.indexOf(id);
    if(i>=0){if(S.sel.length>1)S.sel.splice(i,1)}else{S.sel.push(id);if(S.sel.length>2)S.sel.shift()}
    drawPrices();refresh();save();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(k){S[k]=clamp(k,parseInt(t.value.replace(/\D/g,''),10)||LIM[k][0]);refresh();save();return}   // typed DPS / session / travel
  if(t.dataset.pr===undefined)return;                                                              // unit price: accepts 1450, 1.45k, 2.3kk ...
  const v=t.value.trim()?parseMoney(t.value):0;
  t.closest('.pin').classList.toggle('bad',v===null);
  if(v===null)return;
  S.price[NAMES[+t.dataset.pr]]=v;save();paint();
});
document.addEventListener('change',e=>{if(e.target.dataset.k)drawInputs()});
drawInputs();drawPrices();refresh();
</script>
</body>
</html>
